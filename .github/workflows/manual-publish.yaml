name: manual-publish
# Builds the image from this branch and pushes it to GHCR with the given version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, for example 2.4.3'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase. github.repository is FINTLabs/fint-provider.
  IMAGE_NAME: fintlabs/fint-provider

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Log in to ACR to read the v2.4.2 image
        uses: docker/login-action@v3
        with:
          registry: fintlabsacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if the version already exists
        run: |
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }} > /dev/null 2>&1; then
            echo "Image version ${{ inputs.version }} already exists. Choose a new version."
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
